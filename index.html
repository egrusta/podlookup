<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0a0c11; --bg-2:#0d1016; --bg-elev:#10141b; --panel:#14181f; --panel-2:#1a1f28;
  --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.15);
  --txt:#f3f5f9; --txt-2:#c3cad5; --muted:#8a93a2;
  --accent:#3b7dff; --accent-2:#8bb2ff; --accent-soft:rgba(59,125,255,.13); --accent-line:rgba(59,125,255,.34);
  --accent-glow:rgba(59,125,255,.30);
  --radius-xs:8px; --radius-sm:12px; --radius:16px; --radius-lg:22px; --radius-pill:999px;
  --shadow:0 24px 52px -20px rgba(0,0,0,.74);
  --shadow-sm:0 10px 26px -14px rgba(0,0,0,.62);
  --shadow-card:0 18px 40px -22px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.05);
  --sheen:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,0) 46%);
  --stage:#141a23; --stage-a:#1c222c; --stage-b:#121821; --stage-c:#0c1016;
  --gold:#e7b24c;
  --maxw:1200px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[hidden] { display: none !important; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth; -webkit-text-size-adjust:100%}
body{
  margin:0; background-color:var(--bg); color:var(--txt); font-family:var(--font);
  font-size:16px; line-height:1.65; text-align:left; -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;
  background-image:
    radial-gradient(1200px 620px at 78% -12%, rgba(59,125,255,.13), transparent 60%),
    radial-gradient(900px 520px at 4% 0%, rgba(90,140,255,.055), transparent 62%),
    linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 52%);
  background-attachment:fixed; background-repeat:no-repeat;
  overflow-x:hidden;
}
body.no-scroll{overflow:hidden}
img,svg{max-width:100%; display:block}
a{color:inherit; text-decoration:none}
button,input,select,textarea{font:inherit; color:inherit}
h1,h2,h3,h4{margin:0; line-height:1.15; letter-spacing:-.022em; font-weight:650; color:var(--txt)}
h1{font-size:clamp(2.3rem,6vw,3.9rem); letter-spacing:-.036em; line-height:1.04; font-weight:680}
h2{font-size:clamp(1.5rem,3.4vw,2.05rem); letter-spacing:-.028em; font-weight:660}
h3{font-size:1.06rem; font-weight:620; letter-spacing:-.012em}
p{margin:0 0 1em}
p:last-child{margin-bottom:0}
ul{margin:0; padding:0; list-style:none}
strong{font-weight:600; color:#fff}
::selection{background:var(--accent); color:#fff}
:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px; border-radius:var(--radius-xs)}
.skip-link{position:absolute; left:-9999px; top:0; z-index:200; background:var(--accent); color:#fff; padding:10px 18px; border-radius:0 0 var(--radius-xs) 0}
.skip-link:focus{left:8px; top:8px}
.wrap{width:100%; max-width:var(--maxw); margin:0 auto; padding:0 clamp(18px,4vw,30px)}
.narrow{max-width:800px}
.section{padding:clamp(46px,7vw,88px) 0; scroll-margin-top:110px}
.section-head{max-width:640px; margin-bottom:34px}
.section-head h2{margin-bottom:10px}
.section-head p{color:var(--muted); margin:0; font-size:.98rem; line-height:1.62}

/* ---- announcement bar ---- */
.announce{
  background:var(--bg-elev); border-bottom:1px solid var(--line);
  padding:10px 20px; display:flex; flex-wrap:wrap; justify-content:center; gap:6px 26px;
  font-size:.75rem; color:var(--muted); letter-spacing:.01em;
}
.announce-item{display:inline-flex; align-items:center; gap:9px; white-space:nowrap}
.announce-item b{color:var(--txt-2); font-weight:600}
.announce-item::before{content:""; width:4px; height:4px; border-radius:50%; background:var(--line-2); flex:none}
.announce-demo::before{background:#b9822f}
@media(max-width:640px){ .announce{gap:4px 18px; font-size:.7rem} }

/* ---- header ---- */
.site-header{
  position:sticky; top:0; z-index:80;
  background:rgba(10,12,17,.8); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.02), 0 16px 34px -26px rgba(0,0,0,.9);
}
.header-inner{display:flex; align-items:center; gap:12px; height:72px}
.brand{display:flex; align-items:center; gap:10px; font-weight:650; letter-spacing:-.03em; font-size:1.12rem; white-space:nowrap; flex:none}
.brand-mark{color:var(--txt); width:24px; height:24px; flex:none}
.brand-mark svg{width:100%; height:100%}
.brand-text em{font-style:normal; color:var(--muted); margin-left:4px; font-weight:600}
.primary-nav{display:none; gap:2px; margin-left:10px; flex:1; min-width:0}
.primary-nav a{
  position:relative; padding:9px 12px; border-radius:8px; font-size:.86rem; font-weight:500; color:var(--txt-2);
  white-space:nowrap; transition:background .18s ease, color .18s ease;
}
.primary-nav a::after{
  content:""; position:absolute; left:12px; right:12px; bottom:4px; height:1.5px; border-radius:2px;
  background:linear-gradient(90deg, var(--accent), var(--accent-2)); opacity:0; transform:scaleX(.4);
  transition:opacity .22s ease, transform .22s ease;
}
.primary-nav a:hover{background:var(--panel); color:#fff}
.primary-nav a:hover::after{opacity:.4; transform:scaleX(1)}
.primary-nav a.is-active{background:var(--accent-soft); color:#fff; font-weight:600}
.primary-nav a.is-active::after{opacity:1; transform:scaleX(1)}
.header-actions{display:flex; align-items:center; gap:10px; margin-left:auto}
.icon-btn{
  background:transparent; border:1px solid var(--line); color:var(--txt); border-radius:var(--radius-sm);
  width:44px; height:44px; display:grid; place-items:center; cursor:pointer; flex:none;
  transition:border-color .2s ease, background .2s ease, transform .2s ease;
}
.icon-btn:hover{border-color:var(--line-2); background:var(--panel)}
.icon-btn:active{transform:translateY(1px)}
.nav-toggle{order:-1}
.bars{display:grid; gap:4px; width:17px}
.bars i{display:block; height:1.5px; background:currentColor; border-radius:2px}
.search-field{
  display:flex; align-items:center; gap:9px; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius-sm); padding:0 13px; height:44px;
  transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
}
.search-field:focus-within{border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft); background:var(--bg-elev)}
.search-field .ico{width:16px; height:16px; color:var(--muted); flex:none}
.search-field input{border:0; background:transparent; outline:none; width:100%; min-width:0; font-size:.9rem}
.search-field input::placeholder{color:#6b7280}
.header-search{display:none; width:min(230px,24vw); flex:none}
.nav-search{display:none; width:100%}
.btn-cart{
  display:flex; align-items:center; gap:9px; height:44px; padding:0 15px; border-radius:var(--radius-sm);
  border:1px solid var(--line); background:var(--panel); font-size:.86rem; font-weight:600; cursor:pointer; flex:none;
  transition:border-color .2s ease, background .2s ease, transform .2s ease;
}
.btn-cart:hover{border-color:var(--line-2); background:var(--panel-2)}
.btn-cart:active{transform:translateY(1px)}
.cart-count{
  background:transparent; color:var(--txt-2); border:1px solid var(--line-2); min-width:20px; height:20px;
  border-radius:999px; font-size:.7rem; font-weight:600; display:grid; place-items:center; padding:0 6px;
}
@media(min-width:760px){ .header-search{display:flex} }
@media(max-width:759px){ .nav-search{display:flex} }
@media(min-width:1020px){
  .nav-toggle{display:none}
  .primary-nav{display:flex}
}
/* two-tier header while a single row would crowd the destinations */
@media(min-width:1020px) and (max-width:1339.98px){
  .header-inner{
    display:grid; height:auto; align-items:center;
    grid-template-columns:auto minmax(0,1fr) auto;
    grid-template-areas:"brand . actions" "nav nav nav";
    row-gap:6px; padding-top:9px; padding-bottom:9px;
  }
  .brand{grid-area:brand}
  .header-actions{grid-area:actions; margin-left:0}
  .primary-nav{
    grid-area:nav; margin-left:0; gap:4px; padding-top:11px; padding-bottom:3px;
    border-top:1px solid var(--line);
  }
  .primary-nav a{padding:9px 14px}
  .primary-nav a::after{left:14px; right:14px}
  .section{scroll-margin-top:132px}
}
/* single row once every destination fits at full spacing */
@media(min-width:1339.99px){ .site-header .wrap{max-width:1360px} }
@media(max-width:420px){ .btn-cart span:not(.cart-count){display:none} .header-inner{height:64px} }

/* mobile nav panel */
@media(max-width:1019px){
  .primary-nav{
    position:absolute; left:0; right:0; top:100%; background-color:var(--bg-elev); background-image:var(--sheen);
    border-bottom:1px solid var(--line); padding:10px 20px 20px; display:none;
    flex-direction:column; gap:2px; box-shadow:var(--shadow); margin:0; max-height:78vh; overflow:auto;
  }
  .site-header.nav-open .primary-nav{display:flex}
  .primary-nav a{padding:14px 12px; font-size:.96rem; border-radius:8px}
  .primary-nav a::after{display:none}
  .primary-nav a+a{border-top:1px solid var(--line)}
  .primary-nav .nav-search{margin:0 0 10px; background:var(--panel)}
}

/* ---- buttons ---- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:var(--radius-sm); padding:12px 22px; font-weight:600; font-size:.9rem; letter-spacing:-.005em;
  border:1px solid transparent; cursor:pointer; text-align:center;
  transition:background .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease, transform .2s ease;
}
.btn-primary{
  background-image:linear-gradient(180deg,#4d87ff,var(--accent)); color:#fff;
  box-shadow:0 12px 26px -14px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.2);
}
.btn-primary:hover{
  background-image:linear-gradient(180deg,#5c92ff,#3b7dff);
  box-shadow:0 18px 38px -14px rgba(59,125,255,.55), inset 0 1px 0 rgba(255,255,255,.28);
  transform:translateY(-1px);
}
.btn-ghost{background:rgba(255,255,255,.02); border-color:var(--line-2); color:var(--txt)}
.btn-ghost:hover{background:var(--panel-2); border-color:rgba(255,255,255,.26); transform:translateY(-1px)}
.btn-block{width:100%}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none; box-shadow:none}

/* ---- hero ---- */
.hero{position:relative; padding:clamp(48px,7.4vw,100px) 0 clamp(42px,5.6vw,78px)}
.hero-grid{position:relative; display:grid; gap:44px; align-items:center}
.eyebrow{
  display:inline-flex; align-items:center; gap:9px;
  font-size:.72rem; font-weight:600; letter-spacing:.2em; text-transform:uppercase;
  color:var(--muted); margin:0 0 22px;
}
.eyebrow::before{content:""; width:22px; height:1px; background:var(--accent-line); flex:none}
.hero h1{margin:0 0 22px; font-size:clamp(2.4rem,5.6vw,3.85rem); line-height:1.02; letter-spacing:-.042em; font-weight:700}
.hero h1 br{display:none}
.hero h1 span{
  display:block; margin-top:.14em; color:#a4bfff;
  background-image:linear-gradient(96deg,#c9d8ff,#7fa5f5 58%,#a9c0ff);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.hero-sub{color:var(--txt-2); font-size:clamp(1rem,1.9vw,1.13rem); line-height:1.64; max-width:46ch; margin:0 0 30px}
.hero-actions{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:38px}
.hero-actions .btn{min-height:48px; padding:0 22px}
.hero-actions .btn-primary{min-height:52px; padding:0 28px; font-size:.94rem; letter-spacing:-.01em; box-shadow:0 18px 36px -16px rgba(59,125,255,.6), inset 0 1px 0 rgba(255,255,255,.22)}
.hero-actions .btn-primary::after{
  content:""; width:7px; height:7px; margin-left:1px; flex:none;
  border-right:1.7px solid currentColor; border-bottom:1.7px solid currentColor; rotate:-45deg;
  transition:translate .22s ease;
}
.hero-actions .btn-primary:hover::after{translate:3px 0}
.hero-actions .btn-ghost{padding:0 24px}
.hero-points{display:grid; border-top:1px solid var(--line); margin-top:4px}
.hero-points li{position:relative; padding:14px 0 14px 18px; border-bottom:1px solid var(--line); font-size:.9rem; color:var(--muted); line-height:1.55}
.hero-points li::before{content:""; position:absolute; left:1px; top:1.32em; width:7px; height:1px; background:var(--accent-line)}
.hero-points strong{color:var(--txt); font-weight:600}
.hero-visual{position:relative; display:grid; place-items:center; width:min(100%,440px); justify-self:center; padding:14px 0}
.hero-art{
  position:relative; z-index:0; isolation:isolate; width:100%; aspect-ratio:1/1; overflow:hidden; border-radius:var(--radius-lg); padding:0;
  background-color:var(--stage);
  background-image:
    radial-gradient(58% 42% at 50% 74%, rgba(47,125,255,.36), transparent 74%),
    radial-gradient(134% 86% at 50% -10%, rgba(255,255,255,.09), transparent 62%),
    radial-gradient(closest-side at 50% 50%, transparent 66%, rgba(0,0,0,.42) 100%),
    linear-gradient(184deg, var(--stage-a) 0%, var(--stage-b) 58%, var(--stage-c) 100%);
  box-shadow:0 38px 70px -32px rgba(0,0,0,.88), 0 0 0 1px rgba(255,255,255,.06);
}
.hero-art::before{
  content:""; position:absolute; left:50%; top:50%; width:74%; height:74%; translate:-50% -50%; z-index:-1;
  border:1px solid rgba(255,255,255,.055); border-radius:50%; pointer-events:none;
}
.hero-art::after{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:3;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05), inset 0 1px 0 rgba(255,255,255,.11);
}
.hero-art img, .hero-art svg{display:block}
.hero-chip{
  position:absolute; display:inline-flex; align-items:center; gap:8px;
  background-color:rgba(14,18,25,.74); background-image:linear-gradient(180deg, rgba(139,178,255,.12), rgba(139,178,255,0));
  border:1px solid var(--accent-line); border-radius:var(--radius-pill);
  padding:8px 15px; font-size:.74rem; font-weight:600; color:#d5e2ff; white-space:nowrap;
  box-shadow:0 16px 34px -18px rgba(0,0,0,.86), inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.hero-chip::before{content:""; width:5px; height:5px; border-radius:50%; background:var(--accent-2); box-shadow:0 0 0 3px var(--accent-soft); flex:none}
.hero-chip-a{top:6%; left:-2%}
.hero-chip-b{bottom:8%; right:-2%}
@media(min-width:900px){
  .hero-grid{grid-template-columns:1.04fr .96fr; gap:60px}
  .hero-visual{min-height:480px; width:min(100%,472px)}
}
.hero-art .float-stage{translate:-50% -52.4%}
@media(max-width:560px){
  .hero-chip{display:none}
  .hero-art{border-radius:var(--radius)}
  .hero-visual{padding:0; max-width:360px}
}

/* ---- trust ---- */
.trust{border-top:1px solid var(--line); border-bottom:1px solid var(--line); background-color:var(--bg-elev); background-image:var(--sheen); padding:38px 0}
.trust-row{display:grid; gap:26px}
.trust-item strong{display:block; font-size:.9rem; font-weight:600; margin-bottom:5px}
.trust-item p{color:var(--muted); font-size:.84rem; margin:0; line-height:1.58}
.trust-item .dot{display:block; width:6px; height:6px; background:var(--line-2); margin-bottom:14px}
@media(min-width:760px){ .trust-row{grid-template-columns:repeat(4,1fr); gap:32px} }

/* ---- panels ---- */
.panel{background-color:var(--panel); background-image:var(--sheen); border:1px solid var(--line); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow-card)}

/* ---- ecosystem cards ---- */
.eco-grid{display:grid; gap:16px}
.eco-card{
  position:relative; background-color:var(--panel); background-image:var(--sheen); border:1px solid var(--line); border-radius:var(--radius); padding:28px;
  display:flex; flex-direction:column; gap:16px; box-shadow:var(--shadow-card); overflow:hidden;
  transition:border-color .25s ease, background-color .25s ease, transform .25s ease, box-shadow .25s ease;
}
.eco-card::after{
  content:""; position:absolute; left:0; right:0; top:0; height:1px; pointer-events:none; opacity:.5;
  background:linear-gradient(90deg, transparent, var(--pa,#3b7dff), transparent); transition:opacity .3s ease;
}
.eco-card:hover{border-color:var(--pa-line,rgba(59,125,255,.4)); background-color:var(--panel-2); transform:translateY(-3px); box-shadow:0 28px 52px -26px rgba(0,0,0,.82), 0 0 0 1px var(--pa-soft[...]
.eco-card:hover::after{opacity:.95}
.eco-art{
  position:relative; width:124px; height:124px; overflow:hidden; border-radius:var(--radius-sm);
  border:1px solid var(--line); background-color:var(--stage);
  background-image:
    radial-gradient(70% 48% at 50% 74%, var(--pg,rgba(59,125,255,.3)), transparent 76%),
    linear-gradient(184deg, var(--stage-a) 0%, var(--stage-b) 58%, var(--stage-c) 100%);
}
.eco-tag{font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; font-weight:600; color:var(--muted)}
.eco-card h3{font-size:1.16rem}
.eco-card p{color:var(--muted); font-size:.88rem; margin:0; line-height:1.6}
.eco-meta{display:flex; flex-wrap:wrap; gap:7px}
.eco-meta span{font-size:.72rem; color:var(--txt-2); border:1px solid var(--line); border-radius:6px; padding:4px 9px}
.eco-card .btn{margin-top:auto; align-self:flex-start}
@media(min-width:720px){ .eco-grid{grid-template-columns:repeat(3,1fr); gap:18px} }

/* ---- finder ---- */
.finder{display:grid; padding:0; overflow:hidden}
.finder-steps{position:relative; display:grid; align-content:start}

.finder-steps and rest of CSS continues... (rest of original style preserved)
</style>
</head>
