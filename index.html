<script>
/* Ensure the hosted fragment sets a real mobile layout viewport. */
(function () {
  if (!document.querySelector('meta[name="viewport"]')) {
    var viewport = document.createElement('meta');
    viewport.name = 'viewport';
    viewport.content = 'width=device-width, initial-scale=1';
    document.head.appendChild(viewport);
  }
})();

/* Normalise asset paths so the `src/img` base is only added once. */
(function () {
  function normalizeAssetUrl(base, asset) {
    if (!asset || typeof asset !== 'string') return asset || '';

    var value = asset.trim();
    if (!value) return '';

    if (/^(?:[a-z]+:)?\/\//i.test(value) || /^data:/i.test(value) || value.charAt(0) === '/' || value.charAt(0) === '#') {
      return value;
    }

    var cleanBase = String(base || '').replace(/\/+$/, '');
    var cleanValue = value.replace(/^\.\/?/, '').replace(/^\/+/, '');

    if (!cleanBase) return cleanValue;

    var prefix = cleanBase + '/';
    if (cleanValue.indexOf(prefix) === 0) return cleanValue;

    return prefix + cleanValue;
  }

  function patchImage(img) {
    if (!img || !img.getAttribute) return;

    var src = img.getAttribute('src');
    if (!src) return;

    var fixed = normalizeAssetUrl('src/img', src);
    if (fixed !== src) {
      img.setAttribute('src', fixed);
    }
  }

  var images = document.querySelectorAll('img[src]');
  for (var i = 0; i < images.length; i++) {
    patchImage(images[i]);
  }

  if (window.MutationObserver) {
    var observer = new MutationObserver(function (mutations) {
      for (var i = 0; i < mutations.length; i++) {
        var nodes = mutations[i].addedNodes || [];
        for (var j = 0; j < nodes.length; j++) {
          var node = nodes[j];

          if (!node || node.nodeType !== 1) continue;
          if (node.tagName === 'IMG') {
            patchImage(node);
            continue;
          }

          var childImages = node.querySelectorAll ? node.querySelectorAll('img[src]') : [];
          for (var k = 0; k < childImages.length; k++) {
            patchImage(childImages[k]);
          }
        }
      }
    });

    observer.observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
