name: PodLookup mobile Chromium regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Verify static sitemap and compatibility references
        run: npm run test:static

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 390px mobile touch regressions
        run: npx playwright test tests/mobile.spec.js --project=chromium
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playwright-traces
          path: test-results/
          retention-days: 7
